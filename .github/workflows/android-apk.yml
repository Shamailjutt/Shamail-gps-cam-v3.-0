name: Build Android Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK (Gps cam by shamail)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Optimize PERA SHAMAIL GPS Launcher Icons & Watermark Logo
        run: |
          LOGO_SRC="public/assets/aistudio/file_00000000b43482118e46f28b241df8ff_da246cf0.png"
          if [ -f "$LOGO_SRC" ] && command -v convert > /dev/null 2>&1; then
            rm -f android-project/app/src/main/res/drawable-nodpi/default_org_logo.jpg
            mkdir -p android-project/app/src/main/res/drawable-nodpi
            mkdir -p android-project/app/src/main/res/mipmap-mdpi
            mkdir -p android-project/app/src/main/res/mipmap-hdpi
            mkdir -p android-project/app/src/main/res/mipmap-xhdpi
            mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
            mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi
            convert "$LOGO_SRC" -resize 384x384 android-project/app/src/main/res/drawable-nodpi/default_org_logo.png
            convert "$LOGO_SRC" -resize 48x48 android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$LOGO_SRC" -resize 48x48 android-project/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert "$LOGO_SRC" -resize 72x72 android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO_SRC" -resize 72x72 android-project/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert "$LOGO_SRC" -resize 96x96 android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO_SRC" -resize 96x96 android-project/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert "$LOGO_SRC" -resize 144x144 android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO_SRC" -resize 144x144 android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert "$LOGO_SRC" -resize 192x192 android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$LOGO_SRC" -resize 192x192 android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Prepare Gradle Wrapper in android-project
        working-directory: android-project
        run: |
          rm -f local.properties
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            rm -f gradle/wrapper/gradle-wrapper.jar
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Run Gradle :app:assembleDebug
        working-directory: android-project
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
